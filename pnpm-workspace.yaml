packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.5'
  - '@turbo/darwin-arm64@2.11.5'
  - '@turbo/linux-64@2.11.5'
  - '@turbo/linux-arm64@2.11.5'
  - '@turbo/windows-64@2.11.5'
  - '@turbo/windows-arm64@2.11.5'
  - turbo@2.11.5
# Security patches for transitive dependencies (pnpm audit --prod): bump until the parents ship them.
overrides:
  ip-address: '>=10.7.4'
  fast-uri@3: '>=3.1.9 <4'
  fast-uri@4: '>=4.2.3 <5'
