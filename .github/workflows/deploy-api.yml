name: Deploy API

# Build the API + backup images in CI (the 1 GB VM never builds), push to GHCR,
# then deploy to the Oracle VM over Tailscale SSH (no SSH key, no public port).
# Skipped (not failed) until the owner sets the repo variable DEPLOY_ENABLED=true.
# Setup: infra/SETUP.md. Rollback/redeploy: infra/RUNBOOK.md.
#
# Automatic deploys run only AFTER the CI workflow finished green for a push to
# main of this repo (workflow_run), and deploy exactly the commit CI verified
# (head_sha, not the branch tip). A red CI never ships. Manual runs
# (workflow_dispatch) are the owner's explicit override and skip that check.
# workflow_run ignores `paths:`, so the "plan" job re-implements it: it deploys
# only when deploy-relevant files changed since the last commit this workflow
# really deployed. Any doubt (no earlier deploy, unknown sha) means "deploy".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing pos-api tag (a full git sha) instead of building this commit"
        required: false
        default: ""
      rebuild_backup:
        description: "Rebuild the backup image from scratch (fresh base image and apt packages) even if its sources are unchanged"
        type: boolean
        required: false
        default: false

# The run title carries the deployed sha: the plan job reads it back to find
# the last deployed commit.
run-name: Deploy API ${{ github.event.workflow_run.head_sha || inputs.image_tag || github.sha }}

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_REPO: ghcr.io/${{ github.repository_owner }}/pos-api
  BACKUP_REPO: ghcr.io/${{ github.repository_owner }}/pos-backup

jobs:
  plan:
    # Only these two triggers can pass. Manual: started on main. For
    # workflow_run: CI succeeded, it ran for a push (never a pull_request, so no
    # fork code), on main, of THIS repo.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      # workflow_run's github.sha is the tip of main, NOT the commit CI tested:
      # always check out the verified head_sha (or, for a manual run, the ref).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to deploy
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            # Manual run: the owner's explicit call (no CI or relevance check).
            out sha "${GITHUB_SHA}"; out deploy true
            exit 0
          fi
          printf '%s' "${HEAD_SHA}" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "::error::workflow_run head_sha is not a 40-char sha"; exit 1; }
          out sha "${HEAD_SHA}"

          # A re-run of an old CI run must not roll production back.
          tip="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          if [ "${tip}" != "${HEAD_SHA}" ]; then
            echo "::notice::main is now ${tip}; ${HEAD_SHA} is superseded, not deploying it"
            out deploy false; exit 0
          fi

          # The last commit that was really DEPLOYED: the newest earlier run whose
          # "deploy" job succeeded (a run's own conclusion is not enough: a
          # superseded or no-op run ends green without deploying). The run title
          # ends with the sha. Any lookup that fails just means "no base".
          re='^(apps/api/|packages/|infra/compose/|infra/backup/|package\.json$|pnpm-lock\.yaml$|\.github/workflows/deploy-api\.yml$)'
          base=""
          while read -r id title; do
            s="$(printf '%s' "${title}" | grep -Eo '[0-9a-f]{40}' | head -n 1 || true)"
            [ -n "${s}" ] || continue
            git merge-base --is-ancestor "${s}" "${HEAD_SHA}" 2>/dev/null || continue
            concl="$(gh api "repos/${REPO}/actions/runs/${id}/jobs" \
                       --jq '.jobs[] | select(.name == "deploy") | .conclusion' 2>/dev/null </dev/null || true)"
            if [ "${concl}" = "success" ]; then base="${s}"; break; fi
          done < <(gh run list --workflow deploy-api.yml --status success --limit 30 \
                     --json databaseId,displayTitle \
                     --jq '.[] | "\(.databaseId) \(.displayTitle)"' 2>/dev/null || true)

          if [ -z "${base}" ]; then
            echo "no earlier successful run found: deploying"
            out deploy true
          else
            changed="$(git diff --name-only "${base}" "${HEAD_SHA}")"
            if printf '%s\n' "${changed}" | grep -Eq "${re}"; then
              echo "deploy-relevant files changed since ${base}: deploying"
              out deploy true
            else
              echo "::notice::nothing deploy-relevant changed since ${base}: no deploy"
              out deploy false
            fi
          fi

  build:
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.tags.outputs.api_image }}
      backup_image: ${{ steps.tags.outputs.backup_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Resolve image tags
        id: tags
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          REBUILD_BACKUP: ${{ inputs.rebuild_backup }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            if ! printf '%s' "${INPUT_TAG}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::image_tag must be a full 40-char git sha"; exit 1
            fi
            echo "api_image=${API_REPO}:${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "build_api=false" >> "$GITHUB_OUTPUT"
          else
            echo "api_image=${API_REPO}:${SHA}" >> "$GITHUB_OUTPUT"
            echo "build_api=true" >> "$GITHUB_OUTPUT"
          fi
          # Backup image tag = hash of its source files, so an unchanged
          # backup image is not rebuilt or re-pushed on every deploy. A manual
          # "rebuild_backup" run deploys a timestamped tag (so it is rebuilt,
          # without cache, on a fresh base image, to pick up security updates)
          # AND moves the plain src-<hash> tag to the fresh image: otherwise
          # the next ordinary deploy would find the old src-<hash> image still
          # there and go back to it.
          hash="$(git ls-files -s infra/backup | sha256sum | cut -c1-16)"
          plain="${BACKUP_REPO}:src-${hash}"
          image="${plain}"
          if [ "${REBUILD_BACKUP}" = "true" ]; then image="${plain}-r$(date -u +%Y%m%d%H%M)"; fi
          echo "backup_image=${image}" >> "$GITHUB_OUTPUT"
          {
            echo "backup_tags<<TAGS_EOF"
            printf '%s\n' "${image}" "${plain}" "${BACKUP_REPO}:latest" | sort -u
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        if: steps.tags.outputs.build_api == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.tags.outputs.api_image }}
            ${{ env.API_REPO }}:latest
          cache-from: type=gha,scope=pos-api
          cache-to: type=gha,mode=max,scope=pos-api

      - name: Check that a redeployed tag exists
        if: steps.tags.outputs.build_api != 'true'
        run: docker buildx imagetools inspect "${{ steps.tags.outputs.api_image }}" > /dev/null

      - name: Does the backup image already exist?
        id: backup_exists
        run: |
          if docker buildx imagetools inspect "${{ steps.tags.outputs.backup_image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backup image
        if: steps.backup_exists.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: infra/backup
          platforms: linux/amd64
          push: true
          provenance: false
          no-cache: ${{ inputs.rebuild_backup == true }}
          pull: ${{ inputs.rebuild_backup == true }}
          tags: ${{ steps.tags.outputs.backup_tags }}
          cache-from: type=gha,scope=pos-backup
          cache-to: type=gha,mode=max,scope=pos-backup

      # Private GHCR storage is limited on GitHub Free; keep a short history.
      # Needs the repo to have the Admin role on each package (SETUP.md);
      # best effort so a missing permission never blocks a deploy.
      - name: Prune old pos-api versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: pos-api
          package-type: container
          min-versions-to-keep: 10
      - name: Prune old pos-backup versions
        continue-on-error: true
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: pos-backup
          package-type: container
          min-versions-to-keep: 4

  deploy:
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Holds the Tailscale OAuth secrets = root on the VM (deploy is in the
    # docker group). With a plan that supports it, restrict this environment
    # to branch main and keep the TS_OAUTH_* secrets in it (infra/SETUP.md).
    environment: production
    # Read-only package token: this token is handed to the VM for `docker pull`.
    permissions:
      contents: read
      packages: read
    env:
      API_IMAGE: ${{ needs.build.outputs.api_image }}
      BACKUP_IMAGE: ${{ needs.build.outputs.backup_image }}
      API_HOST: ${{ vars.API_HOST }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      # The compose bundle and deploy.sh must match the image: same verified commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Check repo variables
        run: |
          [ -n "${API_HOST}" ] || { echo "::error::repo variable API_HOST is empty"; exit 1; }
          [ -n "${DEPLOY_HOST}" ] || { echo "::error::repo variable DEPLOY_HOST is empty"; exit 1; }

      - name: Join the tailnet (ephemeral node, tag:ci)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Resolve the VM's tailnet address
        run: |
          set -euo pipefail
          ip="$(tailscale ip -4 "${DEPLOY_HOST}")"
          echo "VM_IP=${ip}" >> "$GITHUB_ENV"
          # Tailscale SSH authenticates by tailnet identity (ACL: tag:ci -> deploy),
          # so no SSH key exists for CI. WireGuard already authenticates the peer.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "Host sds-vm" "  HostName ${ip}" "  User deploy" \
            "  StrictHostKeyChecking no" "  UserKnownHostsFile /dev/null" \
            "  LogLevel ERROR" "  ConnectTimeout 20" > ~/.ssh/config
          ssh sds-vm 'id -un && docker compose version'

      - name: Copy compose bundle to /opt/sds
        run: |
          set -euo pipefail
          tar -C infra/compose -czf - docker-compose.yml Caddyfile .env.example deploy.sh dc run-restore-drill.sh \
            | ssh sds-vm 'tar -C /opt/sds -xzf - && chmod 755 /opt/sds/deploy.sh /opt/sds/dc /opt/sds/run-restore-drill.sh && chmod 644 /opt/sds/.env.example'

      - name: Registry login on the VM (job token, read-only)
        id: login
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # actor name expands here on purpose; token goes via stdin
          printf '%s' "${GH_TOKEN}" | ssh sds-vm "docker login ghcr.io -u '${GH_ACTOR}' --password-stdin"

      - name: Deploy (pull, pre-deploy backup, migrate, up)
        id: apply
        run: |
          # deploy.sh exits 10 when it failed AFTER switching the new image in;
          # any other failure happened before anything changed, and rolling
          # back then could wrongly downgrade a healthy same-sha redeploy.
          set +e
          # shellcheck disable=SC2029  # image names expand here on purpose
          ssh sds-vm "/opt/sds/deploy.sh apply '${API_IMAGE}' '${BACKUP_IMAGE}'"
          rc=$?
          if [ "${rc}" -eq 10 ]; then echo "switched=true" >> "$GITHUB_OUTPUT"; fi
          exit "${rc}"

      - name: Smoke test https://API_HOST/healthz (public, through Caddy)
        id: smoke
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://${API_HOST}/healthz"; then echo; echo "smoke OK"; exit 0; fi
            echo "attempt ${i} failed; retrying in 5s"; sleep 5
          done
          echo "::error::https://${API_HOST}/healthz did not answer 2xx"
          exit 1

      # Roll back only if the new image was actually switched in: apply failed
      # with exit 10, or apply succeeded and the smoke test then failed.
      - name: Roll back the API on failure
        if: failure() && steps.login.outcome == 'success' && (steps.apply.outputs.switched == 'true' || steps.apply.outcome == 'success')
        run: |
          # shellcheck disable=SC2029
          ssh sds-vm "/opt/sds/deploy.sh rollback '${API_IMAGE}'"

      - name: Registry logout on the VM
        if: always() && env.VM_IP != ''
        run: ssh sds-vm 'docker logout ghcr.io' || true

      - name: Summary
        if: always()
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          {
            echo "### Deploy API"
            echo "- Commit: \`${SHA}\`"
            echo "- API image: \`${API_IMAGE}\`"
            echo "- Backup image: \`${BACKUP_IMAGE}\`"
            echo "- Apply: ${{ steps.apply.outcome }} · Smoke: ${{ steps.smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
